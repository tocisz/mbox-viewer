name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-binary:
    name: Build Static Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Trunk
        uses: jetli/trunk-action@v0.4.0
        with:
          version: 'latest'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, wasm32-unknown-unknown

      - name: Install musl-tools
        run: sudo apt-get install -y musl-tools

      - name: Install npm dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend
        working-directory: frontend
        run: trunk build --release

      - name: Build Backend (Static)
        working-directory: backend
        # Using cross or simply cargo build with target if musl-tools is sufficient.
        # Ideally 'cross' is better for musl but 'musl-tools' + 'cargo build' works for simple cases.
        # We'll use standard cargo build with musl target since we installed musl-tools.
        run: cargo build --release --target x86_64-unknown-linux-musl --features embed_frontend

      - name: Prepare Artifact
        run: |
          mkdir -p release
          cp backend/target/x86_64-unknown-linux-musl/release/backend mbox-viewer
          chmod +x mbox-viewer
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION#v}
          zip release/mbox-viewer-${VERSION}-linux-amd64.zip mbox-viewer

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/mbox-viewer-*-linux-amd64.zip

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKER_USERNAME }}/mbox-viewer
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
