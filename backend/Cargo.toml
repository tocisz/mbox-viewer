[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
tantivy = "0.22"
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.4", features = ["derive"] }
mailparse = "0.15"
scraper = "0.19"
ego-tree = "0.6"
sha2 = "0.10"
hex = "0.4"
rust-embed = { version = "8.0", optional = true }
mime_guess = "2.0"

[features]
default = []
embed_frontend = ["dep:rust-embed"]

[dev-dependencies]
tempfile = "3.24.0"
